data:
  # 可在调用 train(config, data=...) 时覆盖；支持 parquet 文件或目录。
  path: /home/nuoya_model_train/power_by_date_final_0807/ultra-short-general
  file_glob: "plantid=*.parquet"
  file_date_regex: "plantid=(\\d{4}-\\d{2}-\\d{2})\\.parquet$"
  # 启用后，train()/test() 共用 data.path，并在读取前按文件名日期筛选。
  # start/end 均为闭区间；设为 null 时继续使用 training.split 自动切分。
  date_ranges: null
  # date_ranges:
  #   train:      {start: 2026-06-01, end: 2026-07-31}
  #   validation: {start: 2026-08-01, end: 2026-08-07}
  #   test:       {start: 2026-08-08, end: 2026-08-15}
  province_station: province_guangxi_solar
  plant_station_pattern: "^plant_guangfu\\d{4}$"
  province_capacity: 15000.0
  # forward(dict) 中 timestamp_win int64 的时间单位；datetime64 默认使用 ns。
  tensor_timestamp_unit: ns
  # 保持原脚本行为：用该表覆盖场站装机容量；若输入数据已正确填充则设为 null。
  capacity_csv: /jtdata/products/data/info.csv
  capacity_station_column: plant_pointname
  capacity_value_column: GCCAPACITY
  columns:
    timestamp: timestamp_win
    station: station
    capacity: cap_power_on
    power_history: observe_power
    power_future: observe_power_future

features:
  n_horizons: 16
  minutes_per_point: 15
  history:
    observe_power:
      # 取 [-96:-2] 共94点，排除最新两个可能被治理填补的点。
      # stop: null 表示取到末尾；也支持 indices: [-96, -80, -4, -3]。
      indices: {start: -96, stop: -2}
      capacity_weighted: false
    GHI_SOLARGIS:
      # horizon 从1开始：H1取-95，H16取-80；时间含义取决于上游序列定义。
      index: {base: -96, horizon_offset: true}
      capacity_weighted: true
  future:
    GHI_SOLARGIS_predict:
      index: {base: -1, horizon_offset: true}
      capacity_weighted: true
    TEMP_SOLARGIS_predict:
      index: {base: -1, horizon_offset: true}
      capacity_weighted: true
    ssrd_pos_1_predict:
      index: {base: -1, horizon_offset: true}
      capacity_weighted: true
    t2m_pos_1_predict:
      index: {base: -1, horizon_offset: true}
      capacity_weighted: true
  time: [hour, hour_sin, hour_cos]
model:
  # all 表示 1..n_horizons；也可以写成 [1, 4, 8, 16]。
  horizons: all
  target_scale: 15000.0
  prediction_clip: [0.0, 15750.0]
  device: auto
  architecture:
    n_blocks: 2
    d_block: 512
    dropout: 0.1
    activation: ReLU
    k: 32
    arch_type: tabm
    start_scaling_init: normal

training:
  seed: 2026
  # 与官方指标分母一致；可改为 mse 恢复原训练损失。
  loss: weighted_mae
  epochs: 200
  batch_size: 512
  inference_batch_size: 512
  early_stopping_patience: 10
  # 每隔多少个 epoch 打印一次验证集日志；首个 epoch 始终打印。
  log_every_n_epochs: 10
  learning_rate: 0.002
  weight_decay: 0.0003
  gradient_clipping_norm: 1.0
  preprocessing:
    # false 表示数据已在上游完成缺失值处理，训练和推理均跳过 SimpleImputer。
    use_imputer: true
    noise_std: 0.00001
    min_quantiles: 10
    max_quantiles: 1000
    samples_per_quantile: 30
    # 与原脚本一致，等价于对当前数据量不做抽样。
    quantile_subsample: 1000000000
  split:
    # 两个日期同时设置时优先使用；null 时按数据末尾天数自动划分。
    validation_start: null
    test_start: null
    validation_days: 2
    test_days: 2

evaluation:
  # official_accuracy 越大越好；改成 rmse/mae 时越小越好。
  primary_metric: official_accuracy
  metrics: [rmse, mae, official_accuracy]
  # 官方分母 max(可用功率, capacity_floor_ratio * 装机容量)。
  capacity_floor_ratio: 0.2
  # 独立 evaluate 接口固定按官方16个时效计算；训练20个模型时后4个不参与。
  official_horizons: 16
  # 缺失预测按准确率0处理，即对应归一化误差记为1。
  missing_normalized_error: 1.0
  # 同一目标时刻在不同 future 数组中的可用功率允许的数值误差。
  groundtruth_tolerance: 0.000001

output:
  checkpoint_dir: ./artifacts/tabm_v2
  prediction_column: predict_power_province_guangxi_solar
  # null 时保存到 checkpoint_dir/forecasts，与原脚本目录结构一致。
  forecast_dir: null
  # test() 额外保存的指标长表；evaluate 会优先读取，避免逐个扫描交付小文件。
  evaluation_filename: evaluation_predictions.parquet
  # auto 表示运行当天 YYYYMMDD，也可固定为具体日期字符串。
  date_tag: auto
  method_version: tabm_v2
